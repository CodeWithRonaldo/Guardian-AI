<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="shieldFill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2747"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="strokeGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b9bff"/>
      <stop offset="100%" stop-color="#3d7ef8"/>
    </linearGradient>
    <radialGradient id="coreGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0fca82"/>
      <stop offset="100%" stop-color="#0fca82" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shield silhouette -->
  <g transform="translate(4,2)">
    <path d="M50,4 L82,18 L86,46 C86,73 68,89 50,96 C32,89 14,73 14,46 L18,18 Z"
          fill="url(#shieldFill2)" stroke="url(#strokeGrad2)" stroke-width="3" stroke-linejoin="round"/>

    <circle cx="50" cy="48" r="22" fill="url(#coreGlow2)" opacity="0.35"/>

    <g stroke="#3d7ef8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M50,48 L50,28"/>
      <path d="M50,48 L33,38"/>
      <path d="M50,48 L67,38"/>
      <path d="M50,48 L36,62"/>
      <path d="M50,48 L64,62"/>
      <path d="M50,48 L50,72"/>
    </g>

    <g fill="#5b9bff">
      <circle cx="50" cy="28" r="3"/>
      <circle cx="33" cy="38" r="3"/>
      <circle cx="67" cy="38" r="3"/>
      <circle cx="36" cy="62" r="3"/>
      <circle cx="64" cy="62" r="3"/>
      <circle cx="50" cy="72" r="3"/>
    </g>

    <circle cx="50" cy="48" r="9" fill="#0fca82"/>
    <circle cx="50" cy="48" r="9" fill="none" stroke="#0d1117" stroke-width="1.5"/>
  </g>

  <!-- Wordmark -->
  <text x="118" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#f0f3fa" letter-spacing="-0.5">
    Guardian<tspan fill="#3d7ef8">AI</tspan>
  </text>
  <text x="118" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#7d8aa3" letter-spacing="0.5">
    Autonomous Risk Guardian for Sui
  </text>
</svg>
