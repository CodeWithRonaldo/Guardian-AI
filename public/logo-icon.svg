<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2747"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b9bff"/>
      <stop offset="100%" stop-color="#3d7ef8"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0fca82"/>
      <stop offset="100%" stop-color="#0fca82" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shield silhouette -->
  <path d="M50,4 L82,18 L86,46 C86,73 68,89 50,96 C32,89 14,73 14,46 L18,18 Z"
        fill="url(#shieldFill)" stroke="url(#strokeGrad)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Pulse glow behind core -->
  <circle cx="50" cy="48" r="22" fill="url(#coreGlow)" opacity="0.35"/>

  <!-- Circuit traces -->
  <g stroke="#3d7ef8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M50,48 L50,28"/>
    <path d="M50,48 L33,38"/>
    <path d="M50,48 L67,38"/>
    <path d="M50,48 L36,62"/>
    <path d="M50,48 L64,62"/>
    <path d="M50,48 L50,72"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#5b9bff">
    <circle cx="50" cy="28" r="3"/>
    <circle cx="33" cy="38" r="3"/>
    <circle cx="67" cy="38" r="3"/>
    <circle cx="36" cy="62" r="3"/>
    <circle cx="64" cy="62" r="3"/>
    <circle cx="50" cy="72" r="3"/>
  </g>

  <!-- Guardian core -->
  <circle cx="50" cy="48" r="9" fill="#0fca82"/>
  <circle cx="50" cy="48" r="9" fill="none" stroke="#0d1117" stroke-width="1.5"/>
</svg>
